services:
  postgres:
    image: postgres:16
    container_name: biblioteca-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: biblioteca
    ports:
      - "5432:5432"
    volumes:
      - biblioteca-data:/var/lib/postgresql/data

  volumes:
    biblioteca-data:
      